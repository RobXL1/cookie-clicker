name: Build QuickApp RPK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Unzip uploaded source archive
        run: |
          unzip -o project.zip || unzip -o src.zip

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install hap-toolkit & Build RPK
        run: |
          npm init -y
          npm install hap-toolkit
          npx hap build

      - name: Upload compiled RPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cookie-clicker-rpk
          path: dist/*.rpk
          
