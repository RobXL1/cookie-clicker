name: Build BC - HarmonyOS Lite S1 Active
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake gcc git python3
      - name: Clone JerryScript v2.1.0 - HarmonyOS Lite - NOT Vela
        run: git clone --depth 1 --branch v2.1.0 https://github.com/jerryscript-project/jerryscript.git
      - name: Build jerry-snapshot
        run: cd jerryscript && python3 tools/build.py --snapshot-save=ON --clean --cmake-param="-DCMAKE_POLICY_VERSION_MINIMUM=3.5" --compile-flag="-Wno-error"
      - name: Compile YOUR game to .bc
        run: |
          ./jerryscript/build/bin/jerry-snapshot -o app.bc app.js
          ./jerryscript/build/bin/jerry-snapshot -o index.bc index.js
          ls -l *.bc
      - name: Upload BC files
        uses: actions/upload-artifact@v4
        with:
          name: bc-files
          path: "*.bc"
